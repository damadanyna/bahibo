# coturn pour Banay — STUN/TURN auto-hébergé (BSD-3-Clause).
# Remplacez <DOMAINE>, <IP_PUBLIQUE> et <MOT_DE_PASSE_TURN>.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
# IP publique du VPS, annoncée aux clients dans les candidats relais.
external-ip=<IP_PUBLIQUE>

# Plage UDP des relais, distincte de celle de LiveKit (50000-50200).
min-port=49160
max-port=49400

realm=turn.<DOMAINE>
server-name=turn.<DOMAINE>
fingerprint

# Identifiants statiques (long-term credentials) ; les mêmes que dans
# livekit.yaml > rtc.turn_servers. Un seul compte suffit : le relais ne
# fait que transporter des flux déjà chiffrés (SRTP).
lt-cred-mech
user=banay:<MOT_DE_PASSE_TURN>

# TLS pour le port 5349 : certbot certonly --nginx -d turn.<DOMAINE>
cert=/etc/letsencrypt/live/turn.<DOMAINE>/fullchain.pem
pkey=/etc/letsencrypt/live/turn.<DOMAINE>/privkey.pem
no-tlsv1
no-tlsv1_1

# Le relais ne doit jamais servir à atteindre le réseau interne du VPS.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# Rien d'autre : pas de console d'admin, pas de relais TCP (WebRTC
# n'utilise que l'UDP côté relais).
no-cli
no-tcp-relay
log-file=stdout
