# /etc/nginx/sites-available/livekit.<DOMAINE>
# Expose la signalisation LiveKit (127.0.0.1:7880) en wss://livekit.<DOMAINE>.
# Certificat : certbot --nginx -d livekit.<DOMAINE>

server {
    listen 80;
    listen [::]:80;
    server_name livekit.<DOMAINE>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name livekit.<DOMAINE>;

    ssl_certificate     /etc/letsencrypt/live/livekit.<DOMAINE>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.<DOMAINE>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une session de signalisation dure autant que l'appel ou le live.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
